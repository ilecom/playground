<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- @artifact-start -->
<title>Pocket Snake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<meta name="theme-color" content="#1d2419" id="themeColor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one screen — a handheld "case" holding a monochrome LCD, score strip above,
     a big thumb steering pad below (portrait) or beside (landscape) on touch devices.
     Every 10 points the whole handset swaps to a new LCD palette (set from JS). */
  :root {
    --case: #1d2419;       /* dark olive handset body */
    --case-hi: #2a3324;    /* raised bezel */
    --lcd: #b7c99a;        /* backlit LCD ground */
    --lcd-ink: #2c3a22;    /* LCD pixels */
    --lcd-ghost: #a6b98a;  /* unlit grid dots */
    --label: #c9d6b3;      /* printed text on the case */
    --accent: #e0a43a;     /* amber key / food */
    --font-display: "Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
    --font-body: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--case);
    color: var(--label);
    font-family: var(--font-body);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    transition: background-color 0.8s ease, color 0.8s ease;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-block: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header {
    width: 100%;
    max-width: var(--board, 520px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.04em;
  }
  .hud { display: flex; align-items: center; gap: 14px; }
  .scores { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
  .scores div { display: flex; flex-direction: column; align-items: flex-end; }
  .scores span {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    opacity: 0.7;
  }
  .scores b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
  .icon-btns { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px;
    border: 0; border-radius: 12px;
    background: var(--case-hi);
    color: var(--label);
    font: 700 0.85rem var(--font-display);
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
    transition: background-color 0.8s ease, color 0.8s ease;
  }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  .icon-btn[aria-pressed="false"] { opacity: 0.45; text-decoration: line-through; }

  .screen-wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bezel {
    position: relative;
    padding: 10px;
    background: var(--case-hi);
    border-radius: 14px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.35);
    transition: background-color 0.8s ease;
  }
  .bezel.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    20% { transform: translate(-6px, 2px) rotate(-1deg); }
    40% { transform: translate(5px, -3px) rotate(1deg); }
    60% { transform: translate(-4px, 1px) rotate(-0.5deg); }
    80% { transform: translate(3px, -1px) rotate(0.5deg); }
  }
  canvas {
    display: block;
    background: var(--lcd);
    border-radius: 4px;
    max-width: 100%;
  }
  .overlay {
    position: absolute;
    inset: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    color: var(--lcd-ink);
    background: color-mix(in srgb, var(--lcd) 82%, transparent);
    border-radius: 4px;
    padding: 16px;
  }
  .overlay h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 6vw, 2.2rem);
    text-wrap: balance;
  }
  .overlay p { margin: 0; font-size: 0.85rem; line-height: 1.5; max-width: 30ch; }
  .btn {
    font: 700 0.95rem var(--font-display);
    letter-spacing: 0.06em;
    color: var(--case);
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  .btn:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--label); outline-offset: 3px; }
  .touch .kbd-only { display: none; }
  .no-touch .touch-only { display: none; }

  /* level-up banner */
  .banner {
    position: absolute;
    inset: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    pointer-events: none;
    color: var(--lcd-ink);
    text-align: center;
  }
  .banner strong {
    font-family: var(--font-display);
    font-size: clamp(2rem, 10vw, 3.4rem);
    line-height: 1;
    padding: 10px 18px;
    background: var(--accent);
    color: var(--case);
    border-radius: 10px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    animation: pop 1.6s cubic-bezier(.2,1.6,.4,1) both;
  }
  .banner span {
    font-family: var(--font-display);
    font-size: 0.9rem;
    background: var(--lcd);
    padding: 4px 10px;
    border-radius: 6px;
    animation: fadeUp 1.6s ease both;
  }
  @keyframes pop {
    0% { transform: scale(0.2) rotate(-8deg); opacity: 0; }
    18% { transform: scale(1.15) rotate(3deg); opacity: 1; }
    30% { transform: scale(1) rotate(0); }
    80% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0; }
  }
  @keyframes fadeUp {
    0%, 15% { transform: translateY(10px); opacity: 0; }
    30%, 80% { transform: translateY(0); opacity: 1; }
    100% { opacity: 0; }
  }

  /* thumb steering pad */
  .controls {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .no-touch .controls { display: none; }
  .pad {
    --pad-active: color-mix(in srgb, var(--accent) 45%, transparent);
    --pad-line: color-mix(in srgb, var(--label) 16%, transparent);
    position: relative;
    width: var(--pad-size, 240px);
    height: var(--pad-size, 240px);
    border-radius: 32px;
    background: var(--case-hi);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.05), 0 6px 0 rgba(0,0,0,0.3);
    touch-action: none;
    overflow: hidden;
    transition: background-color 0.8s ease;
  }
  .pad::before {
    content: "";
    position: absolute;
    inset: 0;
    background: conic-gradient(from var(--from, -45deg), var(--pad-active) 0 90deg, transparent 90deg);
    opacity: 0;
  }
  .pad[data-dir]::before { opacity: 1; }
  .pad[data-dir="up"] { --from: -45deg; }
  .pad[data-dir="right"] { --from: 45deg; }
  .pad[data-dir="down"] { --from: 135deg; }
  .pad[data-dir="left"] { --from: 225deg; }
  .pad::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(45deg, transparent calc(50% - 1px), var(--pad-line) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(-45deg, transparent calc(50% - 1px), var(--pad-line) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px));
  }
  .pad .arrow {
    position: absolute;
    z-index: 1;
    font-size: calc(var(--pad-size, 240px) * 0.11);
    line-height: 1;
    color: var(--label);
    opacity: 0.75;
    transform: translate(-50%, -50%);
  }
  .a-up { left: 50%; top: 15%; }
  .a-down { left: 50%; top: 85%; }
  .a-left { left: 15%; top: 50%; }
  .a-right { left: 85%; top: 50%; }
  .pad .hub {
    position: absolute;
    z-index: 1;
    left: 50%; top: 50%;
    width: 24%; height: 24%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--case);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    transition: background-color 0.8s ease;
  }

  /* phone held sideways: pad sits beside the screen */
  .touch.landscape .app {
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto 1fr;
    justify-items: center;
    align-items: center;
    column-gap: 20px;
  }
  .touch.landscape header { grid-column: 1 / -1; max-width: none; }
  .touch.landscape .screen-wrap { grid-row: 2; grid-column: 1; }
  .touch.landscape .controls { grid-row: 2; grid-column: 2; height: 100%; }

  footer { font-size: 0.68rem; opacity: 0.6; text-align: center; }
  @media (prefers-reduced-motion: reduce) {
    .btn:active, .icon-btn:active { transform: none; }
    .bezel.shake { animation: none; }
    .banner strong, .banner span { animation-duration: 0.01s; animation-delay: 0s; }
  }
</style>
<!-- @artifact-head-end -->
</head>
<body>
<!-- @artifact-body-start -->
<div class="app" id="app">
  <header id="header">
    <h1>SNAKE</h1>
    <div class="hud">
      <div class="scores">
        <div><span>Score</span><b id="score">0</b></div>
        <div><span>Best</span><b id="best">0</b></div>
        <div><span>Lvl</span><b id="level">1</b></div>
      </div>
      <div class="icon-btns">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Music and sound" aria-pressed="true">♪</button>
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">II</button>
      </div>
    </div>
  </header>

  <div class="screen-wrap" id="screenWrap">
    <div class="bezel" id="bezel">
      <canvas id="board" aria-label="Snake game board"></canvas>
      <div class="banner" id="banner" hidden>
        <strong id="bannerTitle">LEVEL 2</strong>
        <span id="bannerText">New colors!</span>
      </div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">SNAKE</h2>
        <p id="ovText">
          <span class="kbd-only">Arrow keys or WASD to steer. Space to pause, M for music. Walls wrap around.</span>
          <span class="touch-only">Keep your thumb on the pad and slide it to steer, or swipe on the screen. Walls wrap around.</span>
        </p>
        <button class="btn" id="startBtn" type="button">PLAY</button>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="pad" id="pad" role="group" aria-label="Steering pad">
      <span class="arrow a-up" aria-hidden="true">▲</span>
      <span class="arrow a-left" aria-hidden="true">◀</span>
      <span class="arrow a-right" aria-hidden="true">▶</span>
      <span class="arrow a-down" aria-hidden="true">▼</span>
      <span class="hub" aria-hidden="true"></span>
    </div>
  </div>

  <footer class="kbd-only">←↑→↓ / WASD steer · Space pause · M music · Enter restart</footer>
</div>

<script>
(() => {
  const GRID = 20;               // cells per side
  const START_SPEED = 5;         // moves per second at the start
  const SPEED_PER_POINT = 0.3;   // each piece of food makes the snake a little faster
  const MAX_SPEED = 15;
  const POINTS_PER_LEVEL = 10;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

  // One handset palette per level; cycles after the last one.
  const PALETTES = [
    { name: "Olive",  case: "#1d2419", caseHi: "#2a3324", lcd: "#b7c99a", ink: "#2c3a22", ghost: "#a6b98a", label: "#c9d6b3", accent: "#e0a43a" },
    { name: "Ice",    case: "#16212b", caseHi: "#22313f", lcd: "#a9cfe0", ink: "#1d3546", ghost: "#97bfd2", label: "#c3dbe8", accent: "#ff8a5c" },
    { name: "Sunset", case: "#2b1a1a", caseHi: "#3b2524", lcd: "#f0c3a0", ink: "#4a2218", ghost: "#e2b18e", label: "#f2d2bd", accent: "#e8425a" },
    { name: "Violet", case: "#1f1830", caseHi: "#2d2442", lcd: "#c9b8ec", ink: "#33245a", ghost: "#b9a6e1", label: "#d8ccf2", accent: "#f5c542" },
    { name: "Mint",   case: "#0f2622", caseHi: "#1a3631", lcd: "#9fe3c9", ink: "#11402f", ghost: "#8cd3b8", label: "#bfeedd", accent: "#ff6f91" },
    { name: "Gold",   case: "#2a2410", caseHi: "#3a321a", lcd: "#ecd98a", ink: "#4a3c0e", ghost: "#ddc978", label: "#efe2ad", accent: "#d94f4f" },
  ];
  let COLOR;
  function applyPalette(i) {
    const p = PALETTES[i % PALETTES.length];
    const r = document.documentElement.style;
    r.setProperty("--case", p.case);
    r.setProperty("--case-hi", p.caseHi);
    r.setProperty("--lcd", p.lcd);
    r.setProperty("--lcd-ink", p.ink);
    r.setProperty("--lcd-ghost", p.ghost);
    r.setProperty("--label", p.label);
    r.setProperty("--accent", p.accent);
    const meta = document.getElementById("themeColor");
    if (meta) meta.setAttribute("content", p.case);
    COLOR = { ink: p.ink, ghost: p.ghost, lcd: p.lcd, food: p.accent, label: p.label, name: p.name };
  }
  applyPalette(0);

  const $ = (id) => document.getElementById(id);
  const canvas = $("board"), ctx = canvas.getContext("2d");
  const overlay = $("overlay"), ovTitle = $("ovTitle"), ovText = $("ovText");
  const startBtn = $("startBtn"), scoreEl = $("score"), bestEl = $("best"), levelEl = $("level");
  const banner = $("banner"), bezel = $("bezel"), pad = $("pad"), soundBtn = $("soundBtn");

  const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
  document.body.classList.add(isTouch ? "touch" : "no-touch");

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} },
  };
  let best = parseInt(store.get("snake.best", "0"), 10) || 0;
  bestEl.textContent = best;

  // =====================================================================
  // Sound: a small chiptune loop plus effects, synthesized with Web Audio
  // =====================================================================
  const Sound = (() => {
    let ac, master, musicBus, sfxBus, noise, timer = null, step = 0, nextTime = 0;
    let enabled = store.get("snake.sound", "1") === "1";
    let tempo = 116;

    // 8 bars of eighth notes in A minor (MIDI numbers, null = rest)
    const LEAD = [
      76, null, 72, 76, 79, 76, 72, null,
      77, null, 72, 77, 81, 77, 72, 69,
      76, null, 72, 76, 79, 81, 79, 76,
      74, null, 71, 74, 79, 77, 74, 71,
      81, 79, 76, 72, 74, 76, 72, 69,
      72, 74, 77, 74, 72, 69, 72, null,
      74, 76, 79, 76, 74, 71, 74, 79,
      76, null, 80, null, 83, 80, 76, 74,
    ];
    const BASS_ROOTS = [45, 41, 48, 43, 45, 41, 43, 40]; // Am F C G Am F G E

    function ensure() {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
        musicBus = ac.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
        sfxBus = ac.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(master);
        const len = ac.sampleRate * 0.1;
        noise = ac.createBuffer(1, len, ac.sampleRate);
        const data = noise.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      // play through the iPhone ringer switch once the player has chosen sound on
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      if (ac.state === "suspended") ac.resume();
      return ac;
    }

    const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);

    function tone(midi, t, dur, type, bus, vol) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq(midi), t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.03);
    }

    function kick(t) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(g); g.connect(musicBus);
      o.start(t); o.stop(t + 0.16);
    }

    function hat(t) {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise;
      f.type = "highpass"; f.frequency.value = 7000;
      g.gain.setValueAtTime(0.08, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      s.connect(f); f.connect(g); g.connect(musicBus);
      s.start(t); s.stop(t + 0.05);
    }

    function schedule() {
      const stepDur = 60 / tempo / 2;
      while (nextTime < ac.currentTime + 0.15) {
        const i = step % LEAD.length, bar = Math.floor(i / 8), beat = i % 8;
        const n = LEAD[i];
        if (n !== null) tone(n, nextTime, stepDur * 0.9, "square", musicBus, 0.045);
        const root = BASS_ROOTS[bar];
        tone(beat % 2 ? root + 12 : root, nextTime, stepDur * 0.85, "triangle", musicBus, 0.16);
        if (beat % 4 === 0) kick(nextTime);
        if (beat % 2 === 1) hat(nextTime);
        nextTime += stepDur;
        step++;
      }
    }

    function startMusic() {
      if (!enabled || !ensure()) return;
      const t = ac.currentTime;
      musicBus.gain.cancelScheduledValues(t);
      musicBus.gain.setValueAtTime(musicBus.gain.value, t);
      musicBus.gain.linearRampToValueAtTime(0.5, t + 0.3);
      if (timer === null) {
        nextTime = t + 0.05;
        timer = setInterval(schedule, 25);
        schedule();
      }
    }

    function stopMusic() {
      if (!ac) return;
      const t = ac.currentTime;
      musicBus.gain.cancelScheduledValues(t);
      musicBus.gain.setValueAtTime(musicBus.gain.value, t);
      musicBus.gain.linearRampToValueAtTime(0, t + 0.2);
      if (timer !== null) { clearInterval(timer); timer = null; }
    }

    function sfx(name) {
      if (!enabled || !ensure()) return;
      const t = ac.currentTime + 0.01;
      if (name === "eat") {
        tone(84, t, 0.07, "square", sfxBus, 0.12);
        tone(91, t + 0.05, 0.09, "square", sfxBus, 0.12);
      } else if (name === "level") {
        [72, 76, 79, 84, 88, 91].forEach((n, i) => tone(n, t + i * 0.07, 0.16, "square", sfxBus, 0.14));
        tone(96, t + 0.42, 0.45, "triangle", sfxBus, 0.18);
      } else if (name === "over") {
        [67, 63, 60, 55].forEach((n, i) => tone(n, t + i * 0.14, 0.2, "sawtooth", sfxBus, 0.1));
      }
    }

    function setTempoForLevel(level) { tempo = Math.min(172, 116 + (level - 1) * 10); }

    function setEnabled(on) {
      enabled = on;
      store.set("snake.sound", on ? "1" : "0");
      if (!on) stopMusic();
    }

    return { startMusic, stopMusic, sfx, setTempoForLevel, setEnabled, get enabled() { return enabled; } };
  })();

  function syncSoundBtn() {
    soundBtn.setAttribute("aria-pressed", Sound.enabled ? "true" : "false");
    soundBtn.title = Sound.enabled ? "Sound on" : "Sound off";
  }
  syncSoundBtn();
  function toggleSound() {
    Sound.setEnabled(!Sound.enabled);
    syncSoundBtn();
    if (Sound.enabled && state === "running") Sound.startMusic();
  }

  // =====================================================================
  // Game state
  // =====================================================================
  let snake, dir, queue, food, score, level, state, lastTick, acc, cell;
  // state: "ready" | "running" | "paused" | "over"
  let particles = [], flashUntil = 0, bannerTimer = null;

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [[mid, mid], [mid - 1, mid], [mid - 2, mid]];
    dir = "right";
    queue = [];
    score = 0;
    level = 1;
    scoreEl.textContent = 0;
    levelEl.textContent = 1;
    particles = [];
    banner.hidden = true;
    applyPalette(0);
    Sound.setTempoForLevel(1);
    placeFood();
  }

  function placeFood() {
    const free = [];
    const taken = new Set(snake.map(([x, y]) => x + "," + y));
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!taken.has(x + "," + y)) free.push([x, y]);
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function speed() { return Math.min(MAX_SPEED, START_SPEED + score * SPEED_PER_POINT); }

  function steer(d) {
    if (state === "over") return;     // restart only via button / Enter
    if (state === "ready") start();
    if (state === "paused") resume();
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d === last || d === OPPOSITE[last]) return;
    if (queue.length < 3) queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    // walls wrap: leaving one edge brings the snake back in on the opposite edge
    const head = [(snake[0][0] + dx + GRID) % GRID, (snake[0][1] + dy + GRID) % GRID];
    const eating = food && head[0] === food[0] && head[1] === food[1];
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(([x, y]) => x === head[0] && y === head[1])) return gameOver();
    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      if (score % POINTS_PER_LEVEL === 0) celebrate(head);
      else { Sound.sfx("eat"); buzz(15); }
      placeFood();
      if (!food) return gameOver(true);
    } else {
      snake.pop();
    }
  }

  function celebrate([hx, hy]) {
    level = Math.floor(score / POINTS_PER_LEVEL) + 1;
    levelEl.textContent = level;
    applyPalette(level - 1);
    Sound.sfx("level");
    Sound.setTempoForLevel(level);
    buzz([30, 40, 30, 40, 60]);

    $("bannerTitle").textContent = "LEVEL " + level;
    $("bannerText").textContent = `${score} points · ${COLOR.name}`;
    // restart the CSS animations
    banner.hidden = true; void banner.offsetWidth; banner.hidden = false;
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => { banner.hidden = true; }, 1700);

    if (!REDUCED_MOTION) {
      bezel.classList.remove("shake"); void bezel.offsetWidth; bezel.classList.add("shake");
      flashUntil = performance.now() + 220;
      const colors = [COLOR.food, COLOR.ink, COLOR.label, "#ffffff"];
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
        particles.push({
          x: hx + 0.5, y: hy + 0.5,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4,
          life: 1, decay: 0.6 + Math.random() * 0.6,
          size: 0.25 + Math.random() * 0.3,
          color: colors[i % colors.length],
        });
      }
    }
  }

  function gameOver(won) {
    state = "over";
    Sound.stopMusic();
    Sound.sfx("over");
    buzz([40, 40, 80]);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      store.set("snake.best", best);
    }
    showOverlay(won ? "YOU WIN" : "GAME OVER", `Score ${score} · Level ${level} · Best ${best}`, "PLAY AGAIN");
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    startBtn.textContent = btn;
    overlay.hidden = false;
    startBtn.focus({ preventScroll: true });
  }

  function start() {
    reset();
    state = "running";
    overlay.hidden = true;
    lastTick = performance.now();
    acc = 0;
    Sound.startMusic();
  }

  function pause() {
    if (state !== "running") return;
    state = "paused";
    Sound.stopMusic();
    showOverlay("PAUSED", "Tap resume or press Space.", "RESUME");
  }

  function resume() {
    if (state !== "paused") return;
    state = "running";
    overlay.hidden = true;
    lastTick = performance.now();
    acc = 0;
    Sound.startMusic();
  }

  function togglePause() { state === "running" ? pause() : state === "paused" ? resume() : start(); }

  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // =====================================================================
  // Layout and rendering
  // =====================================================================
  const MIN_PAD = 190;   // smallest comfortable thumb pad, in CSS px
  function resize() {
    const app = $("app"), wrap = $("screenWrap"), controls = $("controls");
    let avail;
    if (isTouch) {
      const landscape = window.innerWidth > window.innerHeight;
      document.body.classList.toggle("landscape", landscape);
      const cs = getComputedStyle(app);
      const innerW = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const innerH = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const headerH = $("header").offsetHeight;
      const gap = 14;
      avail = landscape
        ? Math.min(innerH - headerH - gap, innerW - MIN_PAD - 20)
        : Math.min(innerW, innerH - headerH - MIN_PAD - gap * 2);
    } else {
      avail = Math.min(wrap.clientWidth, wrap.clientHeight);
    }
    const px = Math.max(GRID * 8, Math.floor((avail - 20) / GRID) * GRID);
    cell = px / GRID;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = canvas.style.height = px + "px";
    canvas.width = canvas.height = Math.round(px * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    document.documentElement.style.setProperty("--board", px + 20 + "px");
    if (isTouch) {
      wrap.style.flex = "0 0 auto";
      wrap.style.height = px + 20 + "px";
      wrap.style.width = document.body.classList.contains("landscape") ? px + 20 + "px" : "100%";
      const size = Math.min(controls.clientWidth, controls.clientHeight, 380);
      pad.style.setProperty("--pad-size", Math.max(140, Math.floor(size)) + "px");
    }
    draw(performance.now());
  }

  function pixel(x, y, color, inset) {
    const i = inset * cell;
    ctx.fillStyle = color;
    ctx.fillRect(x * cell + i, y * cell + i, cell - 2 * i, cell - 2 * i);
  }

  function diamond(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
    ctx.closePath(); ctx.fill();
  }

  function draw(now) {
    if (!snake) return;
    ctx.fillStyle = COLOR.lcd;
    ctx.fillRect(0, 0, GRID * cell, GRID * cell);
    // unlit LCD dots
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++) pixel(x, y, COLOR.ghost, 0.12);
    // food: a dark-outlined diamond that gently pulses so it stands out on the LCD
    if (food) {
      const cx = (food[0] + 0.5) * cell, cy = (food[1] + 0.5) * cell;
      const pulse = REDUCED_MOTION ? 1 : 0.92 + 0.08 * Math.sin(now / 160);
      diamond(cx, cy, cell * 0.62 * pulse, COLOR.ink);
      diamond(cx, cy, cell * 0.40 * pulse, COLOR.food);
    }
    // snake
    snake.forEach(([x, y], i) => pixel(x, y, COLOR.ink, i === 0 ? 0.02 : 0.08));
    // eyes on the head
    const [hx, hy] = snake[0], [dx, dy] = DIRS[dir];
    ctx.fillStyle = COLOR.lcd;
    const e = cell * 0.14, cx = (hx + 0.5) * cell, cy = (hy + 0.5) * cell;
    const ox = dy !== 0 ? cell * 0.2 : 0, oy = dx !== 0 ? cell * 0.2 : 0;
    const fx = dx * cell * 0.15, fy = dy * cell * 0.15;
    ctx.fillRect(cx + fx - ox - e / 2, cy + fy - oy - e / 2, e, e);
    ctx.fillRect(cx + fx + ox - e / 2, cy + fy + oy - e / 2, e, e);
    // level-up confetti
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      const s = p.size * cell;
      ctx.fillRect(p.x * cell - s / 2, p.y * cell - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    // level-up flash
    if (now < flashUntil) {
      ctx.globalAlpha = 0.55 * ((flashUntil - now) / 220);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, GRID * cell, GRID * cell);
      ctx.globalAlpha = 1;
    }
  }

  let lastFrame = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (state === "running") {
      acc += now - lastTick;
      lastTick = now;
      let guard = 0;
      while (state === "running" && acc >= 1000 / speed() && guard++ < 5) {
        acc -= 1000 / speed();
        step();
      }
    }
    if (particles.length) {
      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 18 * dt;
        p.life -= p.decay * dt;
      }
      particles = particles.filter((p) => p.life > 0);
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  // =====================================================================
  // Input
  // =====================================================================
  // keyboard
  const KEYMAP = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  };
  window.addEventListener("keydown", (ev) => {
    if (KEYMAP[ev.key]) { ev.preventDefault(); steer(KEYMAP[ev.key]); }
    else if (ev.key === " " || ev.key === "p" || ev.key === "P" || ev.key === "Escape") {
      ev.preventDefault(); togglePause();
    } else if (ev.key === "m" || ev.key === "M") {
      toggleSound();
    } else if (ev.key === "Enter" && state !== "running") {
      ev.preventDefault(); state === "paused" ? resume() : start();
    }
  });

  // swipe anywhere on the game screen
  let touchStart = null;
  const SWIPE_MIN = 18;
  $("screenWrap").addEventListener("touchstart", (ev) => {
    const t = ev.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  $("screenWrap").addEventListener("touchmove", (ev) => {
    if (!touchStart) return;
    ev.preventDefault();
    const t = ev.touches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    if (state === "running") steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    touchStart = { x: t.clientX, y: t.clientY }; // allow chained swipes without lifting
  }, { passive: false });
  $("screenWrap").addEventListener("touchend", () => { touchStart = null; });

  // thumb pad: the direction is whichever wedge (up/right/down/left) the thumb is in.
  // Press anywhere in a wedge to turn; keep the thumb down and slide into another wedge to turn again.
  let padPointer = null, padDir = null;
  function padDirection(ev) {
    const r = pad.getBoundingClientRect();
    const dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * 0.1) return null; // small dead zone in the middle
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  }
  function padInput(ev) {
    const d = padDirection(ev);
    if (!d || d === padDir) return;
    padDir = d;
    pad.dataset.dir = d;
    steer(d);
  }
  pad.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    padPointer = ev.pointerId;
    padDir = null;
    try { pad.setPointerCapture(ev.pointerId); } catch (e) {}
    padInput(ev);
  });
  pad.addEventListener("pointermove", (ev) => { if (ev.pointerId === padPointer) padInput(ev); });
  const padRelease = (ev) => {
    if (ev.pointerId !== padPointer) return;
    padPointer = null; padDir = null;
    delete pad.dataset.dir;
  };
  pad.addEventListener("pointerup", padRelease);
  pad.addEventListener("pointercancel", padRelease);

  $("pauseBtn").addEventListener("click", togglePause);
  soundBtn.addEventListener("click", toggleSound);
  startBtn.addEventListener("click", () => (state === "paused" ? resume() : start()));

  // pause when the app goes to the background (switching apps on iPhone, tabs on Mac)
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  // block double-tap zoom and pinch on iOS Safari
  document.addEventListener("gesturestart", (ev) => ev.preventDefault());
  document.addEventListener("dblclick", (ev) => ev.preventDefault());

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 150));

  reset();
  state = "ready";
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame(loop);
})();
</script>
<!-- @artifact-body-end -->
